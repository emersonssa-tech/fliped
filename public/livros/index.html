<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Livros das turmas · FLIPED 2026</title>
<meta property="og:title" content="Livros das turmas · FLIPED 2026">
<meta property="og:description" content="Os livros coletivos escritos e desenhados pelas crianças na FLIPED 2026, Feira Literária Pedagógica do Grupo PED.">
<meta property="og:image" content="/fliped-og.png">
<link rel="icon" href="/fliped-logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&family=Nunito:wght@700;800;900&family=Kalam:wght@700&display=swap">
<style>
:root{--navy:#1b3a8a;--ink:#2c2824;--cream:#fbefdb;--orange:#f26522;--yellow:#ffcb2e;--blue:#1f8fe0;--green:#2fa84f}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--cream);color:var(--navy);font-family:Nunito,system-ui,sans-serif;min-height:100vh}
.wrap{max-width:760px;margin:0 auto;padding:22px 16px 48px}
header{text-align:center;padding:8px 0 4px}
.logo{width:min(300px,70vw);height:auto;display:block;margin:0 auto}
.sub{font-family:Kalam,cursive;font-size:clamp(22px,6vw,30px);margin:2px 0 0;transform:rotate(-2deg)}
.sub b{font-family:'Baloo 2',sans-serif;font-size:.7em;border-bottom:4px solid var(--orange);margin-left:6px}
h1{font-family:'Baloo 2',sans-serif;font-weight:800;color:#fff;background:var(--orange);display:inline-block;margin:18px 0 6px;padding:6px 26px 4px;border-radius:40px 30px 44px 28px;box-shadow:0 5px 0 #c9420f;font-size:clamp(26px,7vw,40px);line-height:1.1;transform:rotate(-1deg)}
.lead{font-weight:800;font-size:17px;line-height:1.4;margin:14px auto 18px;max-width:560px;text-align:center}
.search{display:flex;align-items:center;gap:10px;background:#fff;border:3px solid var(--blue);border-radius:999px;padding:4px 18px;margin:0 auto 22px;max-width:520px}
.search svg{flex:none}
.search input{flex:1;border:0;outline:0;font:800 17px Nunito,sans-serif;color:var(--navy);padding:10px 0;background:transparent;min-width:0}
.search input::placeholder{color:#7b8bb5}
.unit{background:#fff;border-radius:26px;margin:0 0 16px;box-shadow:0 4px 0 rgba(27,58,138,.12);overflow:hidden;border-top:8px solid var(--c)}
.unit>button{all:unset;box-sizing:border-box;width:100%;display:flex;align-items:center;gap:12px;padding:16px 20px;cursor:pointer;min-height:56px}
.unit>button:focus-visible{outline:3px solid var(--blue);outline-offset:-3px}
.unit h2{margin:0;flex:1;font-family:'Baloo 2',sans-serif;font-weight:800;font-size:22px;line-height:1.15;color:var(--navy)}
.count{font-weight:900;font-size:14px;color:#fff;background:var(--c);border-radius:999px;padding:3px 12px;white-space:nowrap}
.chev{transition:transform .2s;flex:none}
.unit.open .chev{transform:rotate(180deg)}
.list{display:none;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px;padding:0 16px 18px}
.unit.open .list{display:grid}
.book{display:flex;align-items:center;gap:12px;text-decoration:none;color:var(--navy);background:#f6f0e4;border-radius:18px;padding:12px 14px;min-height:56px;border:2px solid transparent;transition:border-color .15s,transform .15s}
.book:hover,.book:focus-visible{border-color:var(--c);transform:translateY(-1px);outline:none}
.book .ic{flex:none;width:38px;height:38px;border-radius:12px;background:var(--c);display:grid;place-items:center}
.book b{display:block;font-weight:900;font-size:16px;line-height:1.2}
.book small{display:block;font-weight:700;font-size:13px;color:#5b6890}
.empty{display:none;text-align:center;font-weight:800;padding:20px}
footer{text-align:center;font-weight:800;font-size:15px;margin-top:26px;line-height:1.5}
footer span{color:#e3262e}
.uname{font-family:'Baloo 2',sans-serif;font-weight:800;font-size:clamp(22px,6vw,30px);margin:10px 0 0;color:var(--navy)}
.allp{text-align:center;margin:18px 0 0}
.allp a{display:inline-block;font-weight:900;font-size:16px;color:var(--navy);background:var(--yellow);border-radius:999px;padding:12px 22px;text-decoration:none}
[hidden]{display:none!important}
</style>
</head>

 root.querySelectorAll('.unit').forEach(s=>{let n=0;s.querySelectorAll('.book').forEach(a=>{const ok=!v||a.dataset.n.includes(v);a.style.display=ok?'':'none';n+=ok});
  const show=!v||n>0;s.style.display=show?'':'none';if(v){s.classList.toggle('open',n>0)}any+=show});
 document.getElementById('empty').style.display=any?'none':'block'});
</script>
</body>
</html>
